name: Release

# Pull requests build the APK and the desktop apps as downloadable artifacts. A v*.*.* tag,
# or a manual run with a version, builds them all and publishes one GitHub release
# (a manual run creates the v<version> tag on the commit it built).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.0.1 (empty: build only)"
        required: false
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test the Go core
        working-directory: core
        run: go vet ./... && go test ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Cache the Go core
        id: libxray
        uses: actions/cache@v5
        with:
          path: modules/xray-vpn/android/libs/maven
          key: core-${{ hashFiles('core/**', 'scripts/build-libxray.sh') }}

      - name: Set up the Android NDK
        if: steps.libxray.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30

      - name: Build the Go core
        if: steps.libxray.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: scripts/build-libxray.sh

      - run: npm ci

      - name: Stamp the version
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="${RELEASE_VERSION#v}"
          else
            version="$(jq -r .expo.version app.json)"
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            sign() { "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD "$1"; }
          elif [[ -n "$RELEASE_VERSION" ]]; then
            echo "ANDROID_KEYSTORE_B64 secret is missing; a release must be signed with the real key"; exit 1
          else
            # Test builds without the secret get a throwaway key: installable, not updatable.
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass testtest \
              -alias test -keyalg RSA -keysize 2048 -validity 365 -dname "CN=We1ssConnect test"
            sign() { "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass pass:testtest "$1"; }
            echo "::warning::Signed with a throwaway test key (ANDROID_KEYSTORE_B64 is not set)"
          fi
          # One APK per ABI (app/build.gradle splits, see plugins/withAbiSplits.js).
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/app-*-release*.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')"
            out="dist/we1ssconnect-android-${APP_VERSION}-${abi}.apk"
            cp "$f" "$out"
            sign "$out"
            ls -l "$out"
          done
          rm -f "$RUNNER_TEMP/release.p12"
          "$apksigner" verify --print-certs "$out" | grep -i "certificate DN"

      - uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-android
          path: dist/

  # Windows and Linux: the same screens exported for the web, inside a Wails window (desktop/).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: npm ci

      - name: Stamp the version
        run: |
          version="${RELEASE_VERSION#v}"
          [[ -n "$version" ]] || version="$(jq -r .expo.version app.json)"
          jq --arg v "$version" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
          jq --arg v "$version" '.info.productVersion = $v' desktop/wails.json > wails.tmp && mv wails.tmp desktop/wails.json
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Export the screens
        run: npm run desktop:web

      - name: Build
        working-directory: desktop
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          mkdir -p ../dist
          name="we1ssconnect-desktop-${APP_VERSION}-${{ matrix.name }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wails build -platform ${{ matrix.platform }} -s -trimpath -nsis
            cp build/bin/*-installer.exe "../dist/${name}-setup.exe"
          else
            wails build -platform ${{ matrix.platform }} -s -trimpath -tags webkit2_41
            cp build/bin/we1ssconnect "../dist/${name}"
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-${{ matrix.name }}
          path: dist/

  # The router packages (.ipk for OpenWrt 24.10, .apk for 25.12) ship in the same release.
  openwrt:
    if: inputs.version || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/openwrt.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    if: needs.android.result == 'success' && needs.desktop.result == 'success' && needs.openwrt.result == 'success' && (inputs.version || startsWith(github.ref, 'refs/tags/v'))
    needs: [android, desktop, openwrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: we1ssconnect-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          cd dist
          # Phones are ARM; the x86_64 build is only for the emulator test.
          rm -f *-x86_64.apk *-x86.apk *.idsig
          sha256sum * > SHA256SUMS
          cd ..
          # Hand-written notes live in docs/release-notes/<version>.md; otherwise GitHub writes them.
          notes=(--generate-notes)
          [[ -f "docs/release-notes/$version.md" ]] && notes=(--notes-file "docs/release-notes/$version.md")
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "We1ssConnect $version" "${notes[@]}"

  # Installs the APK on an emulator and checks that it starts and the core loads.
  smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: we1ssconnect-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: smoke/
