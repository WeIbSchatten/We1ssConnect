name: Android

# Pull requests build the APK as a downloadable artifact. A v*.*.* tag, or a manual
# run with a version, builds the signed APK and publishes it as a GitHub release
# (a manual run creates the v<version> tag on the commit it built).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.0.1 (empty: build only)"
        required: false
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test the Go core
        working-directory: core
        run: go vet ./... && go test ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Cache the Go core
        id: libxray
        uses: actions/cache@v5
        with:
          path: modules/xray-vpn/android/libs/maven
          key: core-${{ hashFiles('core/**', 'scripts/build-libxray.sh') }}

      - name: Set up the Android NDK
        if: steps.libxray.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30

      - name: Build the Go core
        if: steps.libxray.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: scripts/build-libxray.sh

      - run: npm ci

      - name: Stamp the version
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="${RELEASE_VERSION#v}"
          else
            version="$(jq -r .expo.version app.json)"
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            sign() { "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD "$1"; }
          elif [[ -n "$RELEASE_VERSION" ]]; then
            echo "ANDROID_KEYSTORE_B64 secret is missing; a release must be signed with the real key"; exit 1
          else
            # Test builds without the secret get a throwaway key: installable, not updatable.
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass testtest \
              -alias test -keyalg RSA -keysize 2048 -validity 365 -dname "CN=We1ssConnect test"
            sign() { "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass pass:testtest "$1"; }
            echo "::warning::Signed with a throwaway test key (ANDROID_KEYSTORE_B64 is not set)"
          fi
          # One APK per ABI (app/build.gradle splits, see plugins/withAbiSplits.js).
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/app-*-release*.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')"
            out="dist/we1ssconnect-android-${APP_VERSION}-${abi}.apk"
            cp "$f" "$out"
            sign "$out"
            ls -l "$out"
          done
          rm -f "$RUNNER_TEMP/release.p12"
          "$apksigner" verify --print-certs "$out" | grep -i "certificate DN"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-android
          path: dist/

      - name: Publish the release
        if: env.RELEASE_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Phones are ARM; the x86_64 build is only for the emulator test.
          # Hand-written notes live in docs/release-notes/<version>.md; otherwise GitHub writes them.
          notes=(--generate-notes)
          [[ -f "docs/release-notes/$APP_VERSION.md" ]] && notes=(--notes-file "docs/release-notes/$APP_VERSION.md")
          gh release create "v$APP_VERSION" dist/*-arm64-v8a.apk dist/*-armeabi-v7a.apk dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "We1ssConnect $APP_VERSION" "${notes[@]}"

  # Installs the APK on an emulator and checks that it starts and the core loads.
  smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: we1ssconnect-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-smoke
          path: smoke/
