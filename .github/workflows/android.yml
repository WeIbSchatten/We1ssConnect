name: Android

# Pull requests build the APK as a downloadable artifact. A v*.*.* tag, or a manual
# run with a version, builds the signed APK and publishes it as a GitHub release
# (a manual run creates the v<version> tag on the commit it built).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.0.1 (empty: build only)"
        required: false
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  LIBXRAY_VERSION: v26.10.17
  RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Cache libXray
        id: libxray
        uses: actions/cache@v5
        with:
          path: modules/xray-vpn/android/libs/maven
          key: libxray-maven-${{ env.LIBXRAY_VERSION }}

      - name: Set up the Android NDK
        if: steps.libxray.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30

      - name: Build libXray
        if: steps.libxray.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: scripts/build-libxray.sh

      - run: npm ci

      - name: Stamp the version
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="${RELEASE_VERSION#v}"
          else
            version="$(jq -r .expo.version app.json)"
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          out="we1ssconnect-android-${APP_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
              --ks-pass env:KEYSTORE_PASSWORD "$out"
            rm -f "$RUNNER_TEMP/release.p12"
          elif [[ -n "$RELEASE_VERSION" ]]; then
            echo "ANDROID_KEYSTORE_B64 secret is missing; a release must be signed with the real key"; exit 1
          else
            # Test builds without the secret get a throwaway key: installable, not updatable.
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -storetype PKCS12 -storepass testtest \
              -alias test -keyalg RSA -keysize 2048 -validity 365 -dname "CN=We1ssConnect test"
            "$apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:testtest "$out"
            echo "::warning::Signed with a throwaway test key (ANDROID_KEYSTORE_B64 is not set)"
          fi
          "$apksigner" verify --print-certs "$out" | grep -i "certificate DN"
          sha256sum "$out" > "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-android
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

      - name: Publish the release
        if: env.RELEASE_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" "$APK" "$APK.sha256" --target "$GITHUB_SHA" \
            --title "We1ssConnect $APP_VERSION" --generate-notes

  # Installs the APK on an emulator and checks that it starts and the core loads.
  smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: we1ssconnect-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-smoke
          path: smoke/
