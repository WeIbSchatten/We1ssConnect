name: OpenWrt

# The router client: unit, integration and TPROXY end-to-end tests inside the real OpenWrt
# userland of each supported release, then .ipk (24.10) and .apk (25.12) builds with the SDK.
on:
  workflow_dispatch:
  pull_request:
    paths: ["openwrt/**", ".github/workflows/openwrt.yml"]
  push:
    branches: [main]
    paths: ["openwrt/**", ".github/workflows/openwrt.yml"]
  workflow_call:
    inputs:
      version:
        type: string
        required: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        release: ["24.10", "25.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load the TPROXY modules nft -c needs
        run: sudo modprobe -a nft_tproxy nf_tproxy_ipv4 nf_tproxy_ipv6 nft_socket
      - name: Test on OpenWrt ${{ matrix.release }}
        run: |
          docker run --rm --privileged -v "$PWD/openwrt:/src" \
            "openwrt/rootfs:x86-64-openwrt-${{ matrix.release }}" sh /src/tests/ci.sh

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: The .pot and ru .po match the strings in the code
        run: |
          node openwrt/i18n/i18n.mjs openwrt/luci-app-we1ssconnect openwrt/i18n/ru.json
          git diff --exit-code -- openwrt/luci-app-we1ssconnect/po

  build:
    needs: [test, translations]
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "24.10.8"
            format: ipk
          - sdk: "25.12.6"
            format: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "VERSION=${version:-0.0.${{ github.run_number }}}" >> "$GITHUB_ENV"
      - name: Build with the OpenWrt ${{ matrix.sdk }} SDK
        run: |
          mkdir -p dist && chmod 777 dist
          docker run --rm -v "$PWD/openwrt:/src:ro" -v "$PWD/dist:/out" \
            "openwrt/sdk:x86-64-${{ matrix.sdk }}" sh /src/build.sh /src /out "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: we1ssconnect-openwrt-${{ matrix.format }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error

  # Installs the built packages with opkg/apk on a booted OpenWrt and drives LuCI in Chromium.
  luci:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.10"
            format: ipk
          - release: "25.12"
            format: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: we1ssconnect-openwrt-${{ matrix.format }}
          path: pkgs
      - name: Install LuCI and We1ssConnect with the release's package manager
        run: |
          docker run --name prep -v "$PWD/pkgs:/pkgs:ro" -v "$PWD/openwrt:/src:ro" \
            "openwrt/rootfs:x86-64-openwrt-${{ matrix.release }}" sh /src/tests/luci-setup.sh install
          docker commit prep owrt-luci > /dev/null
      - name: Boot it and connect
        run: |
          sudo modprobe -a nft_tproxy nf_tproxy_ipv4 nf_tproxy_ipv6 nft_socket
          docker run -d --name owrt --privileged -p 8080:80 -v "$PWD/openwrt:/src:ro" owrt-luci /sbin/init
          for i in $(seq 1 30); do docker exec owrt ubus list we1ssconnect > /dev/null 2>&1 && break; sleep 1; done
          docker exec owrt sh /src/tests/luci-setup.sh configure
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Drive LuCI
        run: |
          npm install --no-save playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/cgi-bin/luci/ > /dev/null && break; sleep 1; done
          node openwrt/tests/luci-e2e.mjs http://127.0.0.1:8080 shots
      - name: Service log
        if: always()
        run: docker exec owrt sh -c 'logread | tail -n 80' || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: luci-screenshots-${{ matrix.release }}
          path: shots/
