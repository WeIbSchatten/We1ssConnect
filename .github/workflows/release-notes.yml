name: Release notes

# Replaces a published release's text with docs/release-notes/<version>.md and removes
# the .idsig files apksigner leaves next to APKs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.0.0
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "v$VERSION" --notes-file "docs/release-notes/$VERSION.md"
      - name: Remove stray signature files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "v$VERSION" --json assets --jq '.assets[].name | select(endswith(".idsig"))' |
            xargs -r -n1 gh release delete-asset "v$VERSION" -y
