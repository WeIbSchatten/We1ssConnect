plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.we1bschatten.xrayvpn'
version = '0.1.0'

android {
  namespace "com.we1bschatten.xrayvpn"
}

dependencies {
  // libXray.aar (Xray-core for Android) is built by scripts/build-libxray.sh.
  implementation fileTree(dir: 'libs', include: ['*.aar'])
  implementation "androidx.core:core-ktx:1.17.0"
}
